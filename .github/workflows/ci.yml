name: CI

on:
  push:
    branches:
      - second_branch
      - main
  pull_request:
    branches:
      - second_branch
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build services
        run: |
          go build ./services/auth/cmd/api
          go build ./services/gateway/cmd/api
          go build ./services/courses/cmd/api
          go build ./services/payment/cmd/api
          go build ./services/ai-chat/cmd/api
          go build ./services/ai-tests/cmd/api

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs:
      - frontend
      - go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=cringearium
          POSTGRES_PASSWORD=ci_password
          JWT_SECRET=ci_jwt_secret
          JWT_TTL=24h
          EOF

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Check containers
        run: docker compose ps

      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Check frontend
        run: curl --fail --silent http://localhost:3000 > /dev/null

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
