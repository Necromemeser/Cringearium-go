<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Вспомнить, проверить, повторить</title><desc id="desc">Знакомый вид страницы не заменяет самостоятельного ответа.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#64748b"/></marker></defs><rect width="960" height="430" rx="24" fill="#f1f5fb"/><g font-family="system-ui, sans-serif"><text x="40" y="57" font-size="29" font-weight="700" fill="#17324d">Вспомнить, проверить, повторить</text><text x="40" y="91" font-size="18" fill="#52677d">Знакомый вид страницы не заменяет самостоятельного ответа.</text><rect x="40.0" y="135" width="199.0" height="180" rx="15" fill="white" stroke="#3266a8" stroke-width="2"/><rect x="56.0" y="151" width="30" height="30" rx="9" fill="#3266a8"/><text x="71.0" y="173" text-anchor="middle" font-size="19" fill="white">1</text><text x="56.0" y="216" font-size="21" font-weight="700" fill="#17324d">Вспомнить</text><text x="56.0" y="251" font-size="18" fill="#52677d">Закрой конспект</text><text x="56.0" y="279" font-size="18" fill="#52677d">Дай свой ответ</text><path d="M242.0 225 H263.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="267.0" y="135" width="199.0" height="180" rx="15" fill="white" stroke="#8055af" stroke-width="2"/><rect x="283.0" y="151" width="30" height="30" rx="9" fill="#8055af"/><text x="298.0" y="173" text-anchor="middle" font-size="19" fill="white">2</text><text x="283.0" y="216" font-size="21" font-weight="700" fill="#17324d">Проверить</text><text x="283.0" y="251" font-size="18" fill="#52677d">Сверь с источником</text><text x="283.0" y="279" font-size="18" fill="#52677d">Найди расхождение</text><path d="M469.0 225 H490.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="494.0" y="135" width="199.0" height="180" rx="15" fill="white" stroke="#00846b" stroke-width="2"/><rect x="510.0" y="151" width="30" height="30" rx="9" fill="#00846b"/><text x="525.0" y="173" text-anchor="middle" font-size="19" fill="white">3</text><text x="510.0" y="216" font-size="21" font-weight="700" fill="#17324d">Исправить</text><text x="510.0" y="251" font-size="18" fill="#52677d">Объясни ошибку</text><text x="510.0" y="279" font-size="18" fill="#52677d">Реши новый пример</text><path d="M696.0 225 H717.0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="721.0" y="135" width="199.0" height="180" rx="15" fill="white" stroke="#b16217" stroke-width="2"/><rect x="737.0" y="151" width="30" height="30" rx="9" fill="#b16217"/><text x="752.0" y="173" text-anchor="middle" font-size="19" fill="white">4</text><text x="737.0" y="216" font-size="21" font-weight="700" fill="#17324d">Вернуться</text><text x="737.0" y="251" font-size="18" fill="#52677d">Повтори позже</text><text x="737.0" y="279" font-size="18" fill="#52677d">Проверь перенос</text><text x="40" y="365" font-size="18" fill="#52677d">План повторения помогает заметить пробелы, а не только узнавать текст.</text><text x="40" y="401" font-size="14" fill="#52677d">Cringearium · учебная схема</text></g></svg>
