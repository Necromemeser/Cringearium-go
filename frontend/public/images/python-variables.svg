<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title"><title id="title">Переменные Python</title><rect width="960" height="360" rx="20" fill="#f3f7ff"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17345e">Переменная = имя + значение</text><g font-family="monospace" font-size="22"><rect x="38" y="78" width="420" height="58" rx="12" fill="#d9ecff"/><text x="58" y="114" fill="#174c80">name = "Mira"</text><rect x="500" y="78" width="420" height="58" rx="12" fill="#fff0bd"/><text x="520" y="114" fill="#765400">str · строка</text><rect x="38" y="154" width="420" height="58" rx="12" fill="#d7f7e9"/><text x="58" y="190" fill="#126a4b">age = 16</text><rect x="500" y="154" width="420" height="58" rx="12" fill="#e6e0ff"/><text x="520" y="190" fill="#4c3693">int · целое число</text><rect x="38" y="230" width="420" height="58" rx="12" fill="#ffe0e5"/><text x="58" y="266" fill="#9b2d49">is_ready = True</text><rect x="500" y="230" width="420" height="58" rx="12" fill="#d7f7e9"/><text x="520" y="266" fill="#126a4b">bool · истина/ложь</text></g></svg>