services:
  postgres:
    image: postgres:17-alpine
    container_name: cringearium-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: ./services/auth/Dockerfile
    container_name: cringearium-auth
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cringearium_auth?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  courses:
    build:
      context: .
      dockerfile: ./services/courses/Dockerfile
    container_name: cringearium-courses
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cringearium_courses?sslmode=disable
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: ./services/payment/Dockerfile
    container_name: cringearium-payment
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cringearium_payment?sslmode=disable
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy

  ai-chat:
    build:
      context: .
      dockerfile: ./services/ai-chat/Dockerfile
    container_name: cringearium-ai-chat
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cringearium_ai_chat?sslmode=disable
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  ai-tests:
    build:
      context: .
      dockerfile: ./services/ai-tests/Dockerfile
    container_name: cringearium-ai-tests
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/cringearium_ai_tests?sslmode=disable
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: