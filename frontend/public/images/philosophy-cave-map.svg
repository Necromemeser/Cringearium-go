<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Как возникает доступный образ</title><desc id="desc">Учебная схема аллегории, а не буквальная реконструкция античной пещеры.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8" fill="#64748b"/></marker></defs><rect width="960" height="430" rx="24" fill="#f1f5fb"/><g font-family="system-ui, sans-serif"><text x="40" y="57" font-size="29" font-weight="700" fill="#17324d">Как возникает доступный образ</text><text x="40" y="91" font-size="18" fill="#52677d">Учебная схема аллегории, а не буквальная реконструкция античной пещеры.</text><rect x="40.0" y="135" width="274.6666666666667" height="180" rx="15" fill="white" stroke="#3266a8" stroke-width="2"/><rect x="56.0" y="151" width="30" height="30" rx="9" fill="#3266a8"/><text x="71.0" y="173" text-anchor="middle" font-size="19" fill="white">1</text><text x="56.0" y="216" font-size="21" font-weight="700" fill="#17324d">Источник</text><text x="56.0" y="251" font-size="18" fill="#52677d">Предмет и условия</text><text x="56.0" y="279" font-size="18" fill="#52677d">освещения</text><path d="M317.6666666666667 225 H338.6666666666667" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="342.6666666666667" y="135" width="274.6666666666667" height="180" rx="15" fill="white" stroke="#8055af" stroke-width="2"/><rect x="358.6666666666667" y="151" width="30" height="30" rx="9" fill="#8055af"/><text x="373.6666666666667" y="173" text-anchor="middle" font-size="19" fill="white">2</text><text x="358.6666666666667" y="216" font-size="21" font-weight="700" fill="#17324d">Посредник</text><text x="358.6666666666667" y="251" font-size="18" fill="#52677d">Проекция на стене</text><text x="358.6666666666667" y="279" font-size="18" fill="#52677d">и границы обзора</text><path d="M620.3333333333334 225 H641.3333333333334" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="645.3333333333334" y="135" width="274.6666666666667" height="180" rx="15" fill="white" stroke="#00846b" stroke-width="2"/><rect x="661.3333333333334" y="151" width="30" height="30" rx="9" fill="#00846b"/><text x="676.3333333333334" y="173" text-anchor="middle" font-size="19" fill="white">3</text><text x="661.3333333333334" y="216" font-size="21" font-weight="700" fill="#17324d">Наблюдатель</text><text x="661.3333333333334" y="251" font-size="18" fill="#52677d">Видит образ</text><text x="661.3333333333334" y="279" font-size="18" fill="#52677d">и делает вывод</text><text x="40" y="365" font-size="18" fill="#52677d">Проверка знания: достаточно ли доступного образа для нашего вывода?</text><text x="40" y="401" font-size="14" fill="#52677d">Cringearium · учебная схема</text></g></svg>
