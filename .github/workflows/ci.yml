name: CI

on:
  push:
    branches:
      - second_branch
      - third_branch
      - main
  pull_request:
    branches:
      - second_branch
      - third_branch
      - main

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Learner and research UI regression tests
        run: npm test

      - name: Build
        run: npm run build

  go:
    name: Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: cringearium_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d cringearium_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://ci:ci_test_password@localhost:5432/cringearium_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate authored course catalog
        run: python3 scripts/build_course_catalog.py --check

      - name: Test
        run: go test ./...

      - name: Build services
        run: |
          go build ./services/auth/cmd/api
          go build ./services/gateway/cmd/api
          go build ./services/courses/cmd/api
          go build ./services/payment/cmd/api
          go build ./services/ai-chat/cmd/api
          go build ./services/ai-tests/cmd/api

  docker:
    name: Docker Compose
    runs-on: ubuntu-latest
    needs:
      - frontend
      - go

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=cringearium
          POSTGRES_PASSWORD=ci_password
          JWT_SECRET=ci_jwt_secret
          JWT_TTL=24h
          LLM_BASE_URL=http://localhost:9999
          LLM_API_KEY=ci_api_key
          LLM_MODEL=deepseek-flash
          DEEPSEEK_API_URL=http://localhost:9999
          DEEPSEEK_API_KEY=ci_api_key
          EOF

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Check containers
        run: docker compose ps

      - name: Wait for gateway
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8080/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs frontend
          exit 1

      - name: Backend business workflow smoke test
        run: python3 .github/scripts/smoke_backend.py

      - name: Research workflow and CSV smoke test
        run: python3 .github/scripts/research_api_smoke.py

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop containers
        if: always()
        run: docker compose down -v
